esphome:
  name: "__DEVICE_NAME__"
  friendly_name: "__FRIENDLY_NAME__"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "__API_KEY__"

ota:
  - platform: esphome
    password: "__OTA_PASSWORD__"

network:
  priority:
    - ethernet
    - wifi

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9
__MANUAL_IP__
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "__AP_SSID__"
    password: "__AP_PASSWORD__"

captive_portal:

i2c:
  sda: GPIO17
  scl: GPIO18
  scan: true
  id: bus_a

pcf8574:
  - id: pcf8574_hub_out_1
    address: 0x24
  - id: pcf8574_hub_in_1
    address: 0x25

switch:
  - platform: gpio
    name: "output1"
    id: relay01
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 0
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "output2"
    id: relay02
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 1
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "output3"
    id: relay03
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 2
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "output4"
    id: relay04
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 3
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "output5"
    id: relay05
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 4
      mode: OUTPUT
      inverted: true
  - platform: gpio
    name: "output6"
    id: relay06
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 5
      mode: OUTPUT
      inverted: true

binary_sensor:
  - platform: gpio
    name: "input1"
    id: input01
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 0
      mode:
        input: true
      inverted: true
  - platform: gpio
    name: "input2"
    id: input02
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 1
      mode:
        input: true
      inverted: true
  - platform: gpio
    name: "input3"
    id: input03
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 2
      mode:
        input: true
      inverted: true
  - platform: gpio
    name: "input4"
    id: input04
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 3
      mode:
        input: true
      inverted: true
  - platform: gpio
    name: "input5"
    id: input05
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 4
      mode:
        input: true
      inverted: true
  - platform: gpio
    name: "input6"
    id: input06
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 5
      mode:
        input: true
      inverted: true
